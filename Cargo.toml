[package]
name = "yuyudhan-rmk-nrf52840"
version = "0.1.0"
authors = ["yuyudhan <ankurkumarpandey@gmail.com>"]
description = "yuyudhan-1 Corne split keyboard firmware (RMK, nRF52840 / nice!nano, wireless BLE)"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
# Pinned to the GitHub fork branch `yuyudhan/per-profile-address` (RMK main
# 6c89c4b + per-profile BLE addresses, upstream issue #901), so every machine
# builds the same RMK. Bump deliberately: change the rev, then run `just check both`.
rmk = { git = "https://github.com/yuyudhan/rmk", rev = "b4c481a5ebabd45861342e05efb0e81f69f061e4", features = [
    "nrf52840_ble",
    "ext_adv",
    "split",
    "async_matrix",
    "adafruit_bl",
    "ssd1306",
] }
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "9cf87fa7883b89b2d4dc7cd94864da7927bd858c", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "9cf87fa7883b89b2d4dc7cd94864da7927bd858c", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.11", features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-executor= { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"
embedded-graphics = "0.8"

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

# Split keyboard example
[[bin]]
name = "central"
path = "src/central.rs"

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"

[profile.dev]
codegen-units = 1      # better optimizations
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"

